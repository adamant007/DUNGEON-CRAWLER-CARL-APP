name: Browser Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

jobs:
  clean-shell-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Verify standalone clean app shell
        run: npx playwright test e2e/clean-app-shell.spec.ts --project=chromium-desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-shell-render
          path: |
            test-results/clean-app-shell-main.png
            playwright-report/
          if-no-files-found: warn
          retention-days: 7

  legacy-regression:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium-desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-legacy-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  production-smoke:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Wait for production deployment propagation
        if: github.event_name == 'push'
        run: sleep 45
      - name: Test live Ginger Dragon Studios site
        env:
          E2E_BASE_URL: https://gingerdragonstudios.com
          E2E_GM_EMAIL: ${{ secrets.E2E_GM_EMAIL }}
          E2E_GM_PASSWORD: ${{ secrets.E2E_GM_PASSWORD }}
          E2E_PLAYER_EMAIL: ${{ secrets.E2E_PLAYER_EMAIL }}
          E2E_PLAYER_PASSWORD: ${{ secrets.E2E_PLAYER_PASSWORD }}
        run: npm run test:e2e -- --project=chromium-desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-production-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
