name: Browser Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

jobs:
  local-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium-desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-local-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  production-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Test live Ginger Dragon Fire site
        env:
          E2E_BASE_URL: https://gingerdragonfire.com
          E2E_GM_EMAIL: ${{ secrets.E2E_GM_EMAIL }}
          E2E_GM_PASSWORD: ${{ secrets.E2E_GM_PASSWORD }}
          E2E_PLAYER_EMAIL: ${{ secrets.E2E_PLAYER_EMAIL }}
          E2E_PLAYER_PASSWORD: ${{ secrets.E2E_PLAYER_PASSWORD }}
        run: npm run test:e2e -- --project=chromium-desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-production-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
