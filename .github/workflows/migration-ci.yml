name: Migration CI
# Build the standalone non-Base44 runtime on every migration change.

on:
  push:
    branches: [migrate-off-base44]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
