name: Brand Asset Export

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/brand-asset-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage brand candidates
        run: |
          mkdir -p brand-export
          cp public/brand/studio-homepage.webp brand-export/ 2>/dev/null || true
          cp public/brand/ginger-dragon-fire-full.webp brand-export/ 2>/dev/null || true
          cp public/brand/ginger-dragon-studios-tapestry.png brand-export/ 2>/dev/null || true
          cp public/brand/a_highly_detailed_ornate_fantasy_tapestry_banner_2.png brand-export/ 2>/dev/null || true
          cp public/brand/ginger-dragon-hidden-alcove.webp brand-export/ 2>/dev/null || true
          cp public/brand/ginger-dragon-library.webp brand-export/ 2>/dev/null || true
          ls -lah brand-export
      - name: Upload brand candidates
        uses: actions/upload-artifact@v4
        with:
          name: GingerDragon-Brand-Candidates
          path: brand-export/
          if-no-files-found: error
          retention-days: 1
