<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090806">
  <meta name="description" content="Ginger Dragon RPG Companion — tabletop adventures, characters, campaigns, tools, and more.">
  <meta property="og:title" content="Ginger Dragon RPG Companion">
  <meta property="og:description" content="Your story belongs in bigger worlds.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/brand/homepage-exact.webp">
  <link rel="icon" href="/brand/app-icon.svg" type="image/svg+xml">
  <title>Ginger Dragon RPG Companion</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#090806}
    body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;overflow-x:hidden}
    .stage{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;margin:0 auto;background:#090806}
    .stage>img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
    .enter{
      position:absolute;left:4.0%;top:42.2%;width:24.5%;height:8.5%;
      display:block;border-radius:10px;text-decoration:none;cursor:pointer;
      -webkit-tap-highlight-color:transparent;touch-action:manipulation
    }
    .enter span{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .enter:hover,.enter:focus-visible{
      outline:3px solid rgba(255,216,140,.95);outline-offset:2px;
      box-shadow:0 0 22px rgba(255,170,60,.55);background:rgba(255,190,90,.035)
    }
    .enter:active{background:rgba(255,190,90,.09)}
    @media(max-width:700px){
      .stage{width:100vw;height:auto}
      .enter{min-height:34px}
    }
    @media(prefers-reduced-motion:reduce){.enter{scroll-behavior:auto}}
  </style>
</head>
<body>
  <main class="stage" aria-label="Ginger Dragon RPG Companion">
    <img src="/brand/homepage-exact.webp" alt="Ginger Dragon RPG Companion fantasy homepage">
    <a class="enter" href="https://crawl-companion-quest.base44.app" aria-label="Begin your adventure in RPG Companion">
      <span>Begin your adventure</span>
    </a>
  </main>
</body>
</html>
