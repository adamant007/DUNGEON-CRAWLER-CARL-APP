<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#17130d"/>
  <meta name="description" content="Ginger Dragon Fire Studios — games, software, and adventures."/>
  <meta property="og:title" content="Ginger Dragon Fire Studios"/>
  <meta property="og:description" content="Games, software, and adventures from Ginger Dragon Fire Studios."/>
  <meta property="og:type" content="website"/>
  <meta property="og:image" content="/brand/app-icon.svg"/>
  <meta name="twitter:card" content="summary"/>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <link rel="icon" href="/brand/app-icon.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="/brand/app-icon.svg"/>
  <link rel="stylesheet" href="/brand/brand.css"/>
  <title>Ginger Dragon Fire Studios</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    (()=>{
      const enhance=()=>{
        const footer=document.querySelector('.app>footer, footer');
        if(footer && !footer.querySelector('[data-gdf-copyright]')){
          const line=document.createElement('div');
          line.dataset.gdfCopyright='true';
          line.textContent='© 2026 Ginger Dragon Fire Studios';
          line.style.cssText='margin-top:10px;opacity:.75;font-size:12px;text-align:center';
          footer.appendChild(line);
        }
        document.querySelectorAll('button,span,div').forEach(el=>{
          if(el.children.length===0 && el.textContent?.trim()==='Roadmap Build') el.style.display='none';
        });
      };
      document.addEventListener('click',event=>{
        const button=event.target instanceof Element ? event.target.closest('.app>nav button') : null;
        if(!button) return;
        requestAnimationFrame(()=>{
          button.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
          if(matchMedia('(max-width:720px)').matches){
            document.querySelector('.app>main')?.scrollIntoView({behavior:'smooth',block:'start'});
          }
        });
      },true);
      const observer=new MutationObserver(enhance);
      observer.observe(document.documentElement,{subtree:true,childList:true});
      addEventListener('DOMContentLoaded',enhance,{once:true});
      setTimeout(enhance,250);
    })();
  </script>
</body>
</html>
